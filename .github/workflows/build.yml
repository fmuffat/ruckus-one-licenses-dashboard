name: Build

# Lance les tests et construit les installateurs Windows et Mac.
# Pousser un tag vX.Y.Z publie aussi une pré-version GitHub avec ces fichiers.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npx electron-builder --win --publish never
          - os: macos-latest
            command: npx electron-builder --mac --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        # Le guide reste dans le dépôt : ses captures d'écran ne s'afficheraient pas dans le texte de la version.
        run: >-
          gh release create "$GITHUB_REF_NAME" installers/* --prerelease --title "$GITHUB_REF_NAME"
          --notes "Not an official RUCKUS application: RUCKUS Networks does not provide support for it. / Application non officielle RUCKUS : la société RUCKUS Networks n'en assure pas le support. Testing guide / Guide de test: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/TESTING.md"
